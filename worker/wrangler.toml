name = "tripai-api"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Base bindings (used by `wrangler dev`)
[[d1_databases]]
binding = "DB"
database_name = "tripai-database"
database_id = "fd83d52d-eca1-459f-9de5-bbe4109f2ab0"

# Base config — used by `wrangler dev` (local). No ENVIRONMENT var, so
# the dev-login gate stays open for local testing.
[vars]
APP_URL = "https://Aaryav1130.github.io/Trip.AI"

# Production config — used by `wrangler deploy --env production`. We
# explicitly set ENVIRONMENT=production here so the worker code can
# reliably tell it's running in prod (env is undefined in wrangler dev).
# Bindings are NOT inherited from the top level, so we must redeclare.
[env.production]
name = "tripai-api"

[[env.production.d1_databases]]
binding = "DB"
database_name = "tripai-database"
database_id = "fd83d52d-eca1-459f-9de5-bbe4109f2ab0"

[env.production.vars]
APP_URL = "https://Aaryav1130.github.io/Trip.AI"
ENVIRONMENT = "production"
